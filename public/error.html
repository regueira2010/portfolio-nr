<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <title>Página no encontrada | Nicolás Regueira</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #0F172A;
        color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        background: #1E293B;
        border: 1px solid #334155;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .code {
        font-size: 4rem;
        font-weight: 800;
        color: #FF9900;
        line-height: 1;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
      p { color: #94A3B8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.75rem; }
      a {
        display: inline-block;
        background: #FF9900;
        color: #0F172A;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Página no encontrada</h1>
      <p>La sección o recurso al que intentas acceder no existe o fue movido.</p>
      <a href="/">Volver al Portafolio</a>
    </div>
  </body>
</html>
